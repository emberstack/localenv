services:
  openobserve:
    image: openobserve/openobserve:latest
    container_name: openobserve.localenv.io
    profiles: [full, openobserve]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - ZO_TELEMETRY=false
      - ZO_ROOT_USER_EMAIL=admin@localenv.io
      - ZO_ROOT_USER_PASSWORD=SuperPass123#
      - ZO_DATA_DIR=/data
        # Browser telemetry (OTLP logs / RUM) is posted cross-origin from the dev servers,
      # so OpenObserve must echo Access-Control-Allow-Origin for those origins.
      - ZO_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://127.0.0.1:4200,http://localhost:8100,http://127.0.0.1:8100,http://localhost,capacitor://localhost,ionic://localhost

    ports:
      - "5080:5080"
      - "5081:5081"
    networks:
      default:
        aliases:
          - openobserve.localenv.io
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openobserve.rule=Host(`openobserve.localenv.io`)"
      - "traefik.http.routers.openobserve.entrypoints=web"
      - "traefik.http.services.openobserve.loadbalancer.server.port=5080"
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - openobserve_data:/data


volumes: 
  openobserve_data: