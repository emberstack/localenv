services:
  postgres:
    image: postgres:latest
    container_name: postgres.localenv.io
    profiles: [full, postgres]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    environment:
      POSTGRES_PASSWORD: SuperPass#
    command: -c 'max_connections=500'
    ports:
      - 5432:5432
    networks:
      default:
        aliases:
          - postgres.localenv.io
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin.localenv.io
    profiles: [full, postgres]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localenv.io
      PGADMIN_DEFAULT_PASSWORD: SuperPass#
    networks:
      default:
        aliases:
          - pgadmin.localenv.io
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.localenv.io`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - com.centurylinklabs.watchtower.enable=true

volumes:
  pgadmin_data:
  postgres_data: